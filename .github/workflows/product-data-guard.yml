name: Verify catalog build artifacts

on:
  push:
    paths:
      - data/product_data.json
      - data/category_registry.json
      - astro-poc/**/*
      - .github/workflows/product-data-guard.yml
      - tools/ci/catalog-build-tree-check.mjs
  pull_request:
    paths:
      - data/product_data.json
      - data/category_registry.json
      - astro-poc/**/*
      - .github/workflows/product-data-guard.yml
      - tools/ci/catalog-build-tree-check.mjs
      - test/catalog-build-tree-check.spec.js

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ensure-build-in-sync:
    name: Ensure build artifacts remain reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      dirty_tree: ${{ steps.tree_state.outputs.dirty_tree }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-and-deps

      - name: Set preflight skip OG
        shell: bash
        run: echo "PREFLIGHT_SKIP_OG=1" >> $GITHUB_ENV

      - name: Build storefront
        run: npm run build

      - name: Inspect staged output
        run: |
          ls -R astro-poc/dist | head -n 120

      - name: Check tracked build inputs and synced outputs
        id: tree_state
        run: node tools/ci/catalog-build-tree-check.mjs

      - name: Reject unexpected tracked build drift
        if: ${{ steps.tree_state.outputs.dirty_tree == 'true' }}
        run: |
          echo "::error::Build modified tracked files outside the exact derived-logo allowlist. Commit canonical data/public changes."
          git diff --name-only HEAD --
          exit 1

      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          git status --short > git-status.txt

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-data-guard-artifacts
          path: |
            astro-poc/dist/sitemap.xml
            git-status.txt
          if-no-files-found: warn

      - name: Write guard summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Product Data Guard Summary"
            echo ""
            echo "- Build output root: astro-poc/dist"
            if [ -f astro-poc/dist/sitemap.xml ]; then
              echo "- Sitemap: astro-poc/dist/sitemap.xml"
            else
              echo "- Sitemap: missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  auto-commit-synced-files-for-dependabot:
    name: Auto-commit synced files for Dependabot
    needs: ensure-build-in-sync
    # Gate on the provenance of the diff (a Dependabot-authored PR head branch),
    # not on the trigger actor: github.actor only reports who started this run.
    if: ${{ always() && needs.ensure-build-in-sync.outputs.dirty_tree == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-and-deps

      - name: Set preflight skip OG
        shell: bash
        run: echo "PREFLIGHT_SKIP_OG=1" >> $GITHUB_ENV

      - name: Rebuild synced outputs
        run: npm run build

      - name: Commit synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/product_data.json robots.txt astro-poc/public/robots.txt || true
          git add astro-poc/src/data/products.json astro-poc/src/data/categories.json || true
          git add astro-poc/public/data/ astro-poc/public/app.webmanifest astro-poc/public/service-worker.js astro-poc/public/pages/offline.html || true
          git add assets/images/og/ || true
          git add assets/images/web/ || true
          if git diff --cached --quiet; then
            echo "No synced changes remained after rebuild. Skipping commit."
            exit 0
          fi
          git commit -m "chore(ci): auto-sync generated files for dependabot PR [skip ci]"
          git push
