name: One-shot Loncoleche product photo import

on:
  push:
    branches:
      - catalog/fix-loncoleche-image-20261019

permissions:
  contents: write

jobs:
  import-photo:
    if: github.repository == 'cortega26/elrincondeebano'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified product photo from original Lider SKU
        env:
          SOURCE_PHOTO: https://i5.walmartimages.cl/asr/260bff8e-96b8-4346-b9bf-9f195466e4e4.7985f0dd2718284339811a93bfa8dc8f.jpeg
        run: |
          set -euo pipefail
          mkdir -p /tmp/loncoleche
          curl --fail --location --show-error --silent --retry 4 --retry-delay 3 \
            --connect-timeout 20 --max-time 120 \
            --user-agent "Mozilla/5.0 (compatible; image-import/1.0)" \
            "$SOURCE_PHOTO" --output /tmp/loncoleche/source.jpg
          test "$(wc -c </tmp/loncoleche/source.jpg)" -gt 10000
          file /tmp/loncoleche/source.jpg

      - name: Optimize source to local WebP and AVIF images
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs/promises';
          const input = '/tmp/loncoleche/source.jpg';
          const info = await sharp(input).metadata();
          if (!['jpeg','png','webp'].includes(info.format) || info.width < 400 || info.height < 400) {
            throw new Error('Invalid source photo format or dimensions: ' + JSON.stringify(info));
          }
          const base = 'assets/images/lacteos/loncoleche-crema-sin-lactosa-200ml';
          await fs.mkdir('assets/images/lacteos',{recursive:true});
          const pipeline = sharp(input).rotate().resize(900,900,{
            fit:'contain',background:'#ffffff',withoutEnlargement:true
          }).flatten({background:'#ffffff'});
          await pipeline.clone().webp({quality:82,effort:5}).toFile(base+'.webp');
          await pipeline.clone().avif({quality:53,effort:4}).toFile(base+'.avif');
          const webp = await sharp(base+'.webp').metadata();
          const avif = await sharp(base+'.avif').metadata();
          if (webp.format!=='webp' || avif.format!=='heif') {
            throw new Error('Optimized image verification failed: ' + webp.format + ' / ' + avif.format);
          }
          console.log(JSON.stringify({original:info.format,width:info.width,height:info.height,webp:webp.size,avif:avif.size}));
          NODE

      - name: Update canonical product and generated Astro copies
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='data/product_data.json';
          const catalog=JSON.parse(fs.readFileSync(path,'utf8'));
          const matches=catalog.products.filter(p=>p.id==='p-00780291000417');
          if (matches.length!==1) throw new Error('Expected exactly one Loncoleche product');
          const item=matches[0];
          if (item.image_path || item.image_avif_path || item.price!==2000 || item.discount!==200) {
            throw new Error('Catalog changed unexpectedly; refusing overwrite');
          }
          const stamp=new Date().toISOString();
          const oldRev=item.rev;
          const media='assets/images/lacteos/loncoleche-crema-sin-lactosa-200ml';
          for (const [field,extension] of [['image_path','.webp'],['image_avif_path','.avif']]) {
            item[field]=media+extension;
            item.rev++;
            item.field_last_modified[field]={
              ts:stamp,by:'git',rev:item.rev,base_rev:oldRev,changeset_id:null
            };
          }
          catalog.rev++;
          catalog.last_updated=stamp;
          fs.writeFileSync(path,JSON.stringify(catalog,null,2)+'\n');
          console.log(JSON.stringify({product:item.name,revision:item.rev,baseRevision:oldRev,catalogRevision:catalog.rev}));
          NODE
          npm run images:gap-fill
          node astro-poc/scripts/sync-data.mjs
          npm run guardrails:assets
          npm run lint:images

      - name: Commit only the product photo and metadata; remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-loncoleche-photo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/workflows/one-shot-loncoleche-photo.yml \
            data/product_data.json \
            astro-poc/src/data/products.json \
            astro-poc/public/data/product_data.json \
            assets/images/lacteos/loncoleche-crema-sin-lactosa-200ml.webp \
            assets/images/lacteos/loncoleche-crema-sin-lactosa-200ml.avif \
            assets/images/variants
          git diff --cached --name-only
          git diff --cached --quiet && exit 1
          git commit -m "fix(catalog): add actual Loncoleche 200ml product photo"
          git push origin "HEAD:$GITHUB_REF_NAME"
