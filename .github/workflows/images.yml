name: Optimize images

on:
  push:
    branches: ['main']
    paths:
      - 'assets/images/originals/**'
    tags-ignore:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare branch for image update
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" "refs/remotes/origin/${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
      - name: Set deterministic build environment
        run: |
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "LC_ALL=C.UTF-8" >> $GITHUB_ENV
          echo "LANG=C.UTF-8" >> $GITHUB_ENV
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: bash tools/ci/npm-ci-with-retry.sh
      - run: npm run images:avif
      - run: npm run images:gap-fill
      - run: npm run images:rewrite
      - run: npm run lint:images
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/images/ data/product_data.json astro-poc/src/data/ astro-poc/public/ || true
          if git diff --cached --quiet; then
            echo "No image changes detected. Skipping commit."
            exit 0
          fi
          OUTSIDE=$(git diff --cached --name-only | grep -Ev '^(assets/images/|data/product_data\.json|astro-poc/src/data/|astro-poc/public/)' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Staged files outside the image pipeline allowlist:"
            echo "$OUTSIDE"
            exit 1
          fi
          git commit -m 'chore: update optimized images'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"refs/heads/${GITHUB_REF_NAME}"
