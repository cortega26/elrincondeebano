name: Admin Tools CI

on:
  push:
    paths:
      - 'admin/**'
      - 'tools/category_og/**'
      - 'config/category_og_icon_map.json'
      - 'assets/images/og/icons/**'
      - 'assets/images/og/categories/**'
  pull_request:
    paths:
      - 'admin/**'
      - 'tools/category_og/**'
      - 'config/category_og_icon_map.json'
      - 'assets/images/og/icons/**'
      - 'assets/images/og/categories/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ts:
    name: TypeScript Content Manager
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin/content-manager
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-and-deps

      - name: Lint
        # Plan 127 F1.2: the FULL tree (src + scripts + test) must be
        # error-free in CI — previously only lint-staged covered the admin.
        run: npx eslint src scripts test --config eslint.config.mjs

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit and integration tests
        run: npx vitest run

      - name: Test coverage
        run: npx vitest run --coverage

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Build web app
        run: npm run build

      - uses: ./.github/actions/setup-playwright

      - name: E2E smoke tests (operator suite)
        run: npx playwright test -c playwright.config.ts

      # Plan 127 F1.3: the temp-repo suites run in parallel — each config
      # owns its port (3101-3104/3102) and repo fixture, so the matrix is
      # safe; scope.spec is order-independent (plan 109).
      - name: E2E matrix (isolated temp repos)
        run: |
          npx playwright test -c playwright.import.config.ts &
          npx playwright test -c playwright.changes.config.ts &
          npx playwright test -c playwright.media.config.ts &
          npx playwright test -c playwright.storefront.config.ts &
          npx playwright test -c playwright.scope.config.ts &
          wait

      - name: Certification report
        run: node --import tsx scripts/certification-report.ts --ci

      - name: Rollback and failure drills
        run: node --import tsx scripts/rollback-drill.ts

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-ts-e2e-artifacts
          path: |
            admin/content-manager/test-results
            admin/content-manager/playwright-report
            reports/e2e
            reports/certification
          if-no-files-found: ignore
