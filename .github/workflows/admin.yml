name: Admin Tools CI

on:
  push:
    paths:
      - 'admin/**'
      - 'tools/category_og/**'
      - 'config/category_og_icon_map.json'
      - 'assets/images/og/icons/**'
      - 'assets/images/og/categories/**'
  pull_request:
    paths:
      - 'admin/**'
      - 'tools/category_og/**'
      - 'config/category_og_icon_map.json'
      - 'assets/images/og/icons/**'
      - 'assets/images/og/categories/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin/product_manager

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            admin/product_manager/requirements.txt
            admin/product_manager/requirements.lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock.txt
          python -m pip check

      - name: Run static analysis (ruff)
        run: |
          python -m ruff check .

      - name: Run security scan (bandit)
        run: |
          # Focus on shipped application code; tests intentionally use pytest asserts and fixtures.
          python -m bandit -q -r . -x tests,./tests,.pytest_cache,./.pytest_cache,__pycache__,./__pycache__,.venv-ci-admin,./.venv-ci-admin,.venv,./.venv

      - name: Run tests
        run: |
          # Run pytest with the configuration in tests/conftest.py
          python -m pytest

  test-ts:
    name: TypeScript Content Manager
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin/content-manager
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-and-deps

      - name: Lint
        run: npx eslint src scripts --config eslint.config.mjs

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit and integration tests
        run: npx vitest run

      - name: Test coverage
        run: npx vitest run --coverage

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Build web app
        run: npm run build

      - uses: ./.github/actions/setup-playwright

      - name: E2E smoke tests
        run: npx playwright test -c playwright.config.ts

      - name: E2E import workflow (isolated temp repo)
        run: npx playwright test -c playwright.import.config.ts

      - name: Certification report
        run: node --import tsx scripts/certification-report.ts --ci

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-ts-e2e-artifacts
          path: |
            admin/content-manager/test-results
            admin/content-manager/playwright-report
            reports/e2e
            reports/certification
          if-no-files-found: ignore
