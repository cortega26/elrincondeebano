name: Security Audits

on:
  schedule:
    - cron: '13 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: root
            working_directory: .
            lockfile: package-lock.json
          - label: astro-poc
            working_directory: astro-poc
            lockfile: astro-poc/package-lock.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}
      - name: Run npm audit (${{ matrix.label }}, production only)
        working-directory: ${{ matrix.working_directory }}
        run: npm audit --package-lock-only --omit=dev --audit-level=high
