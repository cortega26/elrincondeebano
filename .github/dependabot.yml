version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 6
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
      npm-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      npm-major:
        patterns:
          - '*'
        update-types:
          - 'major'
    ignore:
      # typescript-eslint peers typescript <6.1.0; a TS7 bump breaks npm ci
      # (ERESOLVE). Re-enable when typescript-eslint publishes TS7 support.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # Plan 200: admin @types/node must stay on the Node-24 runtime line
      # (engines >=24 <25) — v26 types admit APIs that throw at runtime.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    labels:
      - 'dependencies'
      - 'github_actions'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
      actions-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      actions-major:
        patterns:
          - '*'
        update-types:
          - 'major'
  - package-ecosystem: 'pip'
    directory: '/tools'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
      - 'python'
    commit-message:
      prefix: 'chore(ci-deps)'
    ignore:
      # Plan 238: lizard pinned deliberately (complexity baseline).
      - dependency-name: 'lizard'
