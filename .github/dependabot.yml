version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 6
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
      npm-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      npm-major:
        patterns:
          - '*'
        update-types:
          - 'major'
    ignore:
      # typescript-eslint peers typescript <6.1.0; a TS7 bump breaks npm ci
      # (ERESOLVE). Re-enable when typescript-eslint publishes TS7 support.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'npm'
    directory: '/astro-poc'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 6
    labels:
      - 'dependencies'
      - 'npm'
      - 'astro-poc'
    commit-message:
      prefix: 'chore(astro-deps)'
    groups:
      astro-npm-patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
      astro-npm-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      astro-npm-major:
        patterns:
          - '*'
        update-types:
          - 'major'
    ignore:
      # Same rationale as the root npm config: typescript-eslint peers <6.1.0.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-patch:
        patterns:
          - '*'
        update-types:
          - 'patch'
      actions-minor:
        patterns:
          - '*'
        update-types:
          - 'minor'
      actions-major:
        patterns:
          - '*'
        update-types:
          - 'major'
