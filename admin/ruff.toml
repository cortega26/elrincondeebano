# Explicit ruff selection for the legacy admin tooling.
# Ruff keeps promoting preview rules to stable (0.16+ enabled I001/RUF034/
# BLE001/E110/E408 by default), which broke lint with no config changes.
# Pinning the classic default set (E4, E7, E9, F) makes `ruff check` behave
# identically across ruff versions, so dependabot bumps cannot break CI again.
target-version = "py314"
lint.select = ["E4", "E7", "E9", "F"]
exclude = [".venv", ".venv-ci-admin", "__pycache__", ".pytest_cache", "build", "dist"]
